[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldos"
version = "3.0.1"
description = "Graphical offline-first FIELD//OS environment for RAVEN RVN-01"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7.0",
  "PyYAML>=6,<7",
  "cryptography>=41,<47",
  "gpxpy>=1.6,<2",
  "pyroute2>=0.7,<1; sys_platform == 'linux'",
]

[project.optional-dependencies]
system = ["psutil>=6,<8"]
mesh = ["meshtastic>=2,<3"]
radio = ["numpy>=2,<3"]
# python-libzim (PyPI: libzim) is the official openZIM Python binding: a
# compiled wheel (Cython + libzim C++) rather than pure Python, and
# GPL-3.0-licensed, same license family as the meshtastic extra above. It
# ships manylinux wheels for aarch64 as well as win_amd64/macOS, so it works
# on the Raspberry Pi 5 target the same as on this Windows dev box.
library = ["libzim>=3,<4"]
all-python = [
  "psutil>=6,<8",
  "meshtastic>=2,<3",
  "numpy>=2,<3",
  "libzim>=3,<4",
]

[project.scripts]
fieldos = "fieldos.qt_v3_health_app:main"

[tool.setuptools.packages.find]
include = ["fieldos*"]
