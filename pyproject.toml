[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldos"
version = "3.0.1"
description = "Graphical offline-first FIELD//OS environment for RAVEN RVN-01"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7.0",
  "PyYAML>=6,<7",
  "cryptography>=41,<47",
  "gpxpy>=1.6,<2",
  "pyroute2>=0.7,<1; sys_platform == 'linux'",
]

[project.optional-dependencies]
system = ["psutil>=6,<8"]
mesh = ["meshtastic>=2,<3"]
# pyrtlsdr wraps librtlsdr directly via ctypes and adds a continuous
# streaming path (RtlSdrStream in map_radio_adapters.py) alongside the
# existing rtl_sdr-CLI one-shot capture -- see that module for the full
# rationale. GPL-3.0-or-later, same license family as the meshtastic/libzim
# extras below. Pinned to the 0.5.x line specifically because 0.5.0 is the
# version whose source (rtlsdr/rtlsdraio.py, rtlsdr/rtlsdr.py) this
# integration was verified against; a future 0.6 could change stream()'s or
# read_samples()'s behavior in ways nobody here has reviewed. The `[lib]`
# extra pulls in `pyrtlsdrlib`, which bundles a prebuilt librtlsdr shared
# library (MIT-licensed, manylinux aarch64 + x86_64 and win_amd64 wheels) so
# this works without a separate system librtlsdr install on either the
# RVN-01 target or this Windows dev box -- see the PR for why this couldn't
# be verified against real hardware either way.
radio = ["numpy>=2,<3", "pyrtlsdr[lib]>=0.5,<0.6"]
# python-libzim (PyPI: libzim) is the official openZIM Python binding: a
# compiled wheel (Cython + libzim C++) rather than pure Python, and
# GPL-3.0-licensed, same license family as the meshtastic extra above. It
# ships manylinux wheels for aarch64 as well as win_amd64/macOS, so it works
# on the Raspberry Pi 5 target the same as on this Windows dev box.
library = ["libzim>=3,<4"]
all-python = [
  "psutil>=6,<8",
  "meshtastic>=2,<3",
  "numpy>=2,<3",
  "pyrtlsdr[lib]>=0.5,<0.6",
  "libzim>=3,<4",
]

[project.scripts]
fieldos = "fieldos.qt_v3_health_app:main"

[tool.setuptools.packages.find]
include = ["fieldos*"]

[tool.setuptools.package-data]
# Bundled font (Share Tech Mono, SIL OFL 1.1) + its license file. Needed
# here because [packages.find] only decides which Python packages get
# included, not which non-.py data files inside them ship in a built wheel.
# Editable installs (`pip install -e .`, what this project always uses) read
# straight from the source tree regardless, so this only matters for a
# real `pip install .` / wheel build — included for correctness either way.
fieldos = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]
