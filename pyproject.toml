[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldos"
version = "2.2.0"
description = "PySide6 FIELD//OS field-computer shell for RAVEN RVN-01"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7.0",
]

[project.scripts]
fieldos = "fieldos.qt_app:main"

[tool.setuptools.packages.find]
include = ["fieldos*"]
