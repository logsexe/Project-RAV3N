name: FIELD-OS V2 CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qt-shell:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FIELD//OS V2
        run: python -m pip install -e .
      - name: Compile minimal Qt source
        run: python -m compileall fieldos/qt_app.py fieldos/__main__.py
      - name: Qt shell tests
        run: python -m unittest tests.test_qt_v2 -v
