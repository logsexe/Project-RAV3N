name: FIELD-OS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FIELD//OS
        run: python -m pip install -e .
      - name: Compile source
        run: python -m compileall fieldos
      - name: Health check
        run: fieldos-check
